{% load model_badges %}
{% if refresh_info %}<p class="text-xs text-gray-500">{{ refresh_info }}</p>{% endif %}
{% for p in providers %}
<optgroup label="{{ p.name }}">
  {% for m in p.cached_models.all %}{% with c=m|model_badges:p %}<option value="{{ m.model_id }}" {% if conversation and conversation.model_id == m.model_id %}selected{% endif %}>{{ m.model_id }}{% if c.web %} · Internet{% endif %}{% if c.thinking %} · Réflexion{% endif %}{% if c.effort %} · Effort{% endif %}{% if c.route %} · /{{ c.route }}{% endif %}{% if not c.known %} · non vérifié{% endif %}</option>{% endwith %}{% endfor %}
</optgroup>
{% endfor %}
