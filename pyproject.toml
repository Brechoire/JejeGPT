[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
    "RUF012", # attributs de classe mutables = convention Django (admin, Meta, etc.)
]

[tool.ruff.lint.isort]
known-first-party = ["chat", "config"]
